version: 2
updates:
  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  # Maintain Gradle dependencies and plugins
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    # Ignore breaking major version upgrades on sensitive toolchain components.
    # Gradle wrapper, Android Gradle Plugin (AGP), and Kotlin compiler have strict
    # mutual compatibility and NDK requirements that must be updated in lockstep.
    ignore:
      - dependency-name: "com.android.application"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.jetbrains.kotlin*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "gradle"
        update-types: ["version-update:semver-major"]

    # Group minor and patch updates into single consolidated PRs to prevent PR clutter
    groups:
      androidx-dependencies:
        patterns:
          - "androidx.*"
      coroutines:
        patterns:
          - "org.jetbrains.kotlinx:kotlinx-coroutines*"
